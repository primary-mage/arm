seed: 42
device: auto

dataset:
  root_dir: /home/primarymage/WorkFile/arm/dataset
  train_split: 0.8
  target_mode: q
  state_features: [q, dq]
  image_size: [224, 224]
  action_time_offset_sec: 0.0
  max_episodes: 0
  quality_filter:
    enabled: true
    min_frames: 30
    min_states: 100
    min_actions: 20
    min_duration_sec: 3.0
    min_action_total_motion: 0.1
    allowed_close_reasons: [success, fail]

training:
  batch_size: 8
  num_workers: 0
  epochs: 3
  learning_rate: 0.0003
  weight_decay: 0.00001
  log_interval: 10
  output_dir: runs/arm_bc_local

model:
  image_channels: 3
  image_feature_dim: 128
  state_dim: 10
  hidden_dim: 256
  action_dim: 5
